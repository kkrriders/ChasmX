version: '3.8'

# Development docker-compose with hot-reload and debugging enabled
# Usage: docker-compose -f config/docker-compose.dev.yml up
# Note: Uses MongoDB Atlas (configured in apps/backend/.env)

services:
  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: chasmx-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    networks:
      - chasmx-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service (Development mode with hot-reload)
  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: chasmx-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../apps/backend/.env
    environment:
      # Development overrides (MongoDB Atlas URL comes from .env)
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app/src
      # Enable debug mode
      DEBUG: "True"
      LOG_LEVEL: DEBUG
    volumes:
      # Mount source for hot-reload
      - ../apps/backend/src:/app/src:delegated
      - ../apps/backend/tests:/app/tests:delegated
      - backend_dev_cache:/app/__pycache__
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - chasmx-dev-network
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug

  # Frontend Web Service (Development mode with hot-reload)
  frontend:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      target: development
    container_name: chasmx-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      WATCHPACK_POLLING: "true"
    volumes:
      # Mount source for hot-reload
      - ../apps/web/src:/app/src:delegated
      - ../apps/web/public:/app/public:delegated
      - ../apps/web/app:/app/app:delegated
      # Preserve node_modules
      - frontend_dev_modules:/app/node_modules
      - frontend_dev_cache:/app/.next
    depends_on:
      - backend
    networks:
      - chasmx-dev-network

networks:
  chasmx-dev-network:
    driver: bridge
    name: chasmx-dev-network

volumes:
  redis_dev_data:
    name: chasmx-redis-dev-data
  backend_dev_cache:
    name: chasmx-backend-dev-cache
  frontend_dev_modules:
    name: chasmx-frontend-dev-modules
  frontend_dev_cache:
    name: chasmx-frontend-dev-cache
