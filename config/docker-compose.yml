version: '3.8'

services:
  
  redis:
    image: redis:7-alpine
    container_name: chasmx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_data:/data
    networks:
      - chasmx-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service (Production)
  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile.prod
    container_name: chasmx-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../apps/backend/.env
    environment:
      
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: /app/src
    volumes:
      - ../apps/backend/src:/app/src
      - ../apps/backend/tests:/app/tests
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - chasmx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web Service
  frontend:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      target: production
    container_name: chasmx-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      - backend
    networks:
      - chasmx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  chasmx-network:
    driver: bridge
    name: chasmx-network

volumes:
  redis_data:
    name: chasmx-redis-data
